<!doctype html>
<meta charset="utf-8" />
<title>seeded-secrets</title>
<style>
  /* url()-bearing CSS: computed style values, pseudo content, custom-property
     resolutions, declared rule values, and keyframes text all copy author CSS
     verbatim unless every url() is reduced. Relative URLs matter: the engine
     launders them to absolute with the query string intact. */
  #card { --seed-icon: url("/v.png?token=SEEDED-VAR"); }
  #card .u {
    cursor: url("/c.png?token=SEEDED-CURSOR"), pointer;
    filter: url("/f.svg?token=SEEDED-FILTER#blur");
    backdrop-filter: url("/bd.svg?token=SEEDED-BACKDROP#b");
  }
  #card .u::before { content: url("/p.png?token=SEEDED-CONTENT"); }
  #card .v { cursor: var(--seed-icon), pointer; }
  @keyframes seedspin { to { background-image: url("/k.png?token=SEEDED-KEYFRAME"); } }
  #card .w { animation: seedspin 1s linear infinite; }
</style>
<div id="card">
  Card
  <span class="u">styled</span>
  <span class="v">var cursor</span>
  <span class="w">animated</span>
  <input value="SEEDED-INPUT">
  <textarea>SEEDED-AREA</textarea>
  <div contenteditable="true">SEEDED-EDITABLE</div>
  <div contenteditable="">SEEDED-EDITABLE-EMPTY</div>
  <div contenteditable="plaintext-only">SEEDED-EDITABLE-PLAIN</div>
  <script>const s='SEEDED-SCRIPT'</script>
  <style>/* SEEDED-STYLE */</style>
  <div hidden>SEEDED-HIDDEN</div>
  <div style="display:none">SEEDED-NONE</div>
  <template>SEEDED-TPL</template>
  <a href="?token=SEEDED-QUERY">link</a>
  <a href="javascript:alert('SEEDED-JS')">js link</a>
  <img src="data:image/svg+xml,SEEDED-DATA" alt="seeded image">
  <span role="checkbox" aria-checked="SEEDED-ARIA-CHECKED" aria-label="opt in">custom checkbox</span>
  <span role="slider" aria-valuenow="SEEDED-ARIA-VALUENOW" aria-valuetext="SEEDED-ARIA-VALUETEXT">custom slider</span>
</div>
